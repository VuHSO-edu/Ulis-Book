# =============================================================================
# ULIS Books — Nginx reference config (ticket 09)
#
# Mục đích: cấu hình reverse proxy cho deploy target, gồm 3 phần:
#   1. Phục vụ static build của frontend (SPA).
#   2. Proxy REST API sang backend Spring Boot (giữ nguyên /api/* -> /*).
#   3. Proxy WebSocket/STOMP cho chat realtime tại /ws (bắt buộc nâng cấp
#      giao thức HTTP/1.1 + header Upgrade/Connection).
#
# Cách dùng: copy file này vào /etc/nginx/conf.d/ (hoặc sites-available) và
# chỉnh server_name, root, upstream theo môi trường thật. Đây là cấu hình tham
# chiếu, chưa gắn vào docker-compose (sẽ hoàn thiện ở ticket deploy).
#
# Lưu ý WebSocket:
#   - Client kết nối tới ws(s)://<host>/ws?token=<access JWT>. Token nằm ở query
#     param vì browser không đặt được header tuỳ chỉnh lúc handshake WS.
#   - PHẢI có `proxy_http_version 1.1` và `proxy_set_header Upgrade $http_upgrade`
#     + `proxy_set_header Connection "upgrade"` thì handshake mới thành công.
#   - Tăng `proxy_read_timeout`/`proxy_send_timeout` để kết nối không bị cắt khi
#     im lặng giữa các tin nhắn.
# =============================================================================

upstream ulis_backend {
    # Spring Boot business-service trong Docker Compose (service `backend`, cổng 8080).
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name nextbooks.online www.nextbooks.online nextbook.ulis.edu.vn localhost _;

    # --- Frontend SPA (Vite/React build) ---
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # --- WebSocket/STOMP cho chat realtime ---
    # Đặt trước các location khác; đây là route riêng, không thuộc /api.
    location /ws {
        proxy_pass http://ulis_backend;
        proxy_http_version 1.1;

        # Nâng cấp giao thức sang WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối lâu cho chat (mặc định 60s dễ bị đóng khi rảnh).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- REST API ---
    # Frontend (.env.production) gọi /business-api/... hoặc /api/...; proxy về backend:8080/
    location /business-api/ {
        proxy_pass http://ulis_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://ulis_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # --- MinIO Object Storage (ảnh bài đăng) ---
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA fallback: mọi route không phải file tĩnh đều trả index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
