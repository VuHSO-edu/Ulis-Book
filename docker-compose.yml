# Docker Compose — full stack ULIS Books (Postgres + Backend + Frontend/Nginx)
# Cách dùng:
#   cp .env.example .env   # điền JWT_SECRET, SMTP (Brevo), ADMIN_PASSWORD
#   docker compose up --build -d
#   docker compose down

name: ulis

services:
  db:
    image: postgres:16-alpine
    container_name: ulis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ulis}
      POSTGRES_USER: ${POSTGRES_USER:-ulis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulis}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ulis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ulis}
      DB_USERNAME: ${POSTGRES_USER:-ulis}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ulis}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-256bit-secret-key-in-prod}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:9000,http://100.122.164.39:9000}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ulis.edu.vn}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ulisminio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ulisminio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ulis-books}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/minio}
    ports:
      - "${BACKEND_PORT:-8088}:8080"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ulis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ulisminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ulisminio123}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ulis-minio-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    volumes:
      - ./deploy/nginx/ulis-books.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ulis-postgres-data:
    driver: local
  ulis-minio-data:
    driver: local
